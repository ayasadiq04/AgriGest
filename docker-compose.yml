services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:HYZ1Iq5zMJTjGdIFZ/w6t90AI+2XqazT8x7+LOPT5IM="

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: agrigest
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      - db

  db:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: agrigest
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: